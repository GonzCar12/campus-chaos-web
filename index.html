		<title>Campus Chaos</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	/* A thumb held on the joystick is a "long press" to a phone browser: without these it
	   starts selecting text / opens the copy bubble and the touch stutters or is dropped. */
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}

input {
	-webkit-user-select: text;
	user-select: text;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0d111c;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

	<body>
<div id="cc-rotate" style="display:none;position:fixed;inset:0;z-index:200;background:#0b0e18;color:#fff;font:600 20px sans-serif;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:14px;padding:24px">
<div style="font-size:64px;transform:rotate(90deg)">&#128241;</div>
<div>Turn your phone sideways to play</div>
<div style="font:14px sans-serif;opacity:.7">Campus Chaos plays in landscape.</div>
</div>
<script>
// Campus Chaos plays sideways only. Where the browser allows it the screen is locked to
// landscape (Android); iPhones don't let a web page lock it, so upright shows this card.
(function () {
	const phone = /iPhone|iPad|iPod|Android/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (!phone) return;
	const card = document.getElementById('cc-rotate');
	function check() { card.style.display = window.innerHeight > window.innerWidth ? 'flex' : 'none'; }
	window.addEventListener('resize', check); window.addEventListener('orientationchange', function () { setTimeout(check, 200); });
	check();
	function lock() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} }
	lock(); document.addEventListener('touchend', lock, { passive: true, once: true });
	// No pinch or double-tap zoom, no long-press menu, no selecting: they fight the game's controls.
	['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart', 'dblclick'].forEach(function (k) {
		document.addEventListener(k, function (e) { if (!(e.target && e.target.tagName === 'INPUT')) e.preventDefault(); }, { passive: false });
	});
}());
</script>
<div id="cc-logbtn" style="display:none;position:fixed;left:8px;bottom:8px;z-index:99;padding:8px 12px;border-radius:8px;background:#333;color:#fff;font:14px sans-serif">Stuck? Tap for details</div>
<pre id="cc-log" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow:auto;z-index:98;margin:0;padding:8px;background:rgba(0,0,0,.88);color:#9f9;font:11px monospace;white-space:pre-wrap"></pre>
<script>
// Campus Chaos: keeps the last lines the game prints, so a stuck load can be photographed and sent.
(function () {
	const lines = [];
	const t0 = Date.now();
	function add(kind, args) {
		try {
			const text = Array.prototype.map.call(args, (a) => (a && a.message) ? a.message : String(a)).join(' ');
			lines.push(((Date.now() - t0) / 1000).toFixed(1) + 's ' + kind + ' ' + text.slice(0, 300));
			if (lines.length > 60) lines.shift();
			const box = document.getElementById('cc-log');
			if (box && box.style.display === 'block') box.textContent = lines.join('\n');
		} catch (e) {}
	}
	['log', 'warn', 'error'].forEach(function (k) { const o = console[k]; console[k] = function () { add(k, arguments); return o.apply(console, arguments); }; });
	window.addEventListener('error', function (e) { add('PAGEERROR', [e.message + ' @' + (e.filename || '') + ':' + (e.lineno || '')]); });
	window.addEventListener('unhandledrejection', function (e) { add('REJECTED', [e.reason]); });
	const mem = navigator.deviceMemory ? ' deviceMemory=' + navigator.deviceMemory + 'GB' : '';
	add('info', ['UA ' + navigator.userAgent + mem]);
	setTimeout(function () { const b = document.getElementById('cc-logbtn'); if (b && !window.ccStarted) b.style.display = 'block'; }, 40000);
	document.addEventListener('click', function (e) {
		if (e.target && e.target.id === 'cc-logbtn') { const box = document.getElementById('cc-log'); box.style.display = box.style.display === 'block' ? 'none' : 'block'; box.textContent = lines.join('\n'); }
	}, true);
}());
</script>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":423929336,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
// Phones and tablets: let the on-screen keyboard open for text boxes (login, chat).
GODOT_CONFIG.experimentalVK = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	
	// Campus Chaos: the game data comes in gzipped parts (GitHub Pages keeps files under 100 MB).
	// They are kept (still gzipped) in Cache Storage, so only the first visit or a new build
	// downloads them. Memory matters on phones (Safari reloads a tab that uses too much, which
	// looks like endless loading): the parts are unpacked straight into ONE buffer of the final
	// size, handed to the engine as its main pack, and dropped once the engine has copied it in.
	async function campusPack(onProgress) {
		const phone = /Android|iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		const list = await (await fetch(phone ? 'parts_mobile.json' : 'parts.json', { cache: 'no-store' })).json();
		const cacheName = 'campus-chaos-z' + list.build;
		let cache = null;
		try {
			cache = await caches.open(cacheName);
			for (const old of await caches.keys()) if (old.startsWith('campus-chaos-z') && old !== cacheName) await caches.delete(old);
		} catch (e) { cache = null; }
		const out = new Uint8Array(list.size);
		let at = 0;
		for (const part of list.parts) {
			let res = cache ? await cache.match(part.file) : null;
			let body;
			if (res) {
				body = res.body;
			} else {
				res = await fetch(part.file);
				if (!res.ok) throw new Error('Could not download the game (' + part.file + ': ' + res.status + ')');
				body = res.body;
				if (cache) {
					const pair = body.tee();
					cache.put(part.file, new Response(pair[0])).catch(() => {});
					body = pair[1];
				}
			}
			const reader = body.pipeThrough(new DecompressionStream('gzip')).getReader();
			for (;;) {
				const step = await reader.read();
				if (step.done) break;
				out.set(step.value, at); at += step.value.length; onProgress(at, list.size);
			}
		}
		if (at !== list.size) throw new Error('The game download was incomplete. Reload the page to try again.');
		out.webBase = list.web_base || 0;
		return out;
	}

	// Phones: starter files that differ by device (smaller copies of the large textures) come as
	// small packs fetched BEFORE the game starts; the game mounts whatever is in /boot first (ota.gd).
	async function campusBootPacks() {
		const phone = /Android|iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		if (!phone) return [];
		const list = await (await fetch('boot_mobile.json', { cache: 'no-store' })).json();
		const cacheName = 'cc-boot-' + list.build;
		let cache = null;
		try {
			cache = await caches.open(cacheName);
			for (const old of await caches.keys()) if (old.startsWith('cc-boot-') && old !== cacheName) await caches.delete(old);
		} catch (e) { cache = null; }
		const out = [];
		for (const pack of list.packs) {
			let res = cache ? await cache.match(pack.file) : null;
			if (!res) {
				res = await fetch(pack.file);
				if (!res.ok) throw new Error('Could not download the game (' + pack.file + ': ' + res.status + ')');
				if (cache) cache.put(pack.file, res.clone()).catch(() => {});
			}
			const bytes = new Uint8Array(await res.arrayBuffer());
			if (bytes.length !== pack.size) {
				if (cache) await cache.delete(pack.file).catch(() => {});
				throw new Error('The game download was incomplete. Reload the page to try again.');
			}
			out.push({ file: pack.file, bytes: bytes });
		}
		return out;
	}

	// Item models are not in the starter download: they come as packs fetched in the background
	// once the game is running (kept in Cache Storage). Each one is copied into the game's file
	// system and listed in window.ccPacks, where the game finds and mounts it (web_packs.gd).
	async function campusItemPacks() {
		let list;
		const phone = /Android|iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		try { list = await (await fetch(phone ? 'packs_mobile.json' : 'packs.json', { cache: 'no-store' })).json(); } catch (e) { return; }
		if (!list || !list.packs || !list.packs.length) return;
		const state = window.ccPacks = { ready: [], total: list.packs.length, done: false };
		// One cache for all packs; each is kept under its name + size + hash, so when one pack
		// changes only that one is fetched again.
		const key = (pack) => pack.file + '?v=' + pack.size + '-' + (pack.hash || '');
		let cache = null;
		try {
			for (const old of await caches.keys()) if (old.startsWith('cc-items-')) await caches.delete(old);
			cache = await caches.open('cc-packs');
			const want = new Set(list.packs.map((pack) => new URL(key(pack), location.href).href));
			for (const req of await cache.keys()) if (!want.has(req.url)) await cache.delete(req);
		} catch (e) { cache = null; }
		for (const pack of list.packs) {
			let bytes = null;
			for (let attempt = 0; attempt < 4 && !bytes; attempt++) {
				try {
					let res = cache ? await cache.match(key(pack)) : null;
					if (!res) {
						res = await fetch(key(pack));
						if (!res.ok) throw new Error(pack.file + ': ' + res.status);
						if (cache) cache.put(key(pack), res.clone()).catch(() => {});
					}
					const got = new Uint8Array(await res.arrayBuffer());
					if (got.length !== pack.size) throw new Error(pack.file + ' incomplete');
					bytes = got;
				} catch (e) {
					console.warn('Item pack', e && e.message);
					if (cache) await cache.delete(key(pack)).catch(() => {});
					await new Promise((r) => setTimeout(r, 3000 * (attempt + 1)));
				}
			}
			if (!bytes) continue;
			engine.copyToFS('/packs/' + pack.file, bytes);
			state.ready.push('/packs/' + pack.file);
		}
		state.done = true;
	}

	// The newest web update (the same patches phones get, made for this build): fetched before
	// the game starts and kept in the browser's cache, then handed to the game, which checks its
	// signature and mounts it (scripts/ota.gd). Any problem: start without it.
	async function campusPatch(webBase) {
		try {
			const api = 'https://campus-chaos-api.onrender.com';
			const info = await (await fetch(api + '/v1/ota/latest?base=' + webBase + '&patch=0&platform=web', { cache: 'no-store' })).json();
			if (!info || !(info.patch > 0) || !info.url) return null;
			const key = 'patch-' + webBase + '-' + info.patch + '-' + info.sha256;
			let cache = null;
			try { cache = await caches.open('campus-chaos-patches'); } catch (e) { cache = null; }
			let res = cache ? await cache.match(key) : null;
			if (!res) {
				res = await fetch(info.url.startsWith('/') ? api + info.url : info.url);
				if (!res.ok) return null;
				const buf = await res.arrayBuffer();
				if (cache) {
					for (const old of await cache.keys()) await cache.delete(old);
					await cache.put(key, new Response(buf));
				}
				return { info: info, bytes: new Uint8Array(buf) };
			}
			return { info: info, bytes: new Uint8Array(await res.arrayBuffer()) };
		} catch (e) {
			return null;
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const showProgress = function (current, total) {
			if (current > 0 && total > 0) { statusProgress.value = current; statusProgress.max = total; }
			else { statusProgress.removeAttribute('value'); statusProgress.removeAttribute('max'); }
		};
		(function () {
			// iPhone / iPad (also iPad asking for the desktop site): Safari there gives a page far less
			// memory than the game needs today, and reloads the tab when it runs out (an endless
			// loading screen). Say so instead, until the smaller phone download is ready.
			if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('This browser is too old for Campus Chaos. Please update it (Safari 16.4 or newer, or a current Chrome, Edge or Firefox).'));
			return Promise.resolve();
		}()).then(() => campusPack(showProgress)).then((pack) => {
			// init + preloadFile(buffer) + start = startGame without a second copy of the pack.
			const exe = GODOT_CONFIG['executable'];
			return Promise.all([engine.init(exe), campusPatch(pack.webBase), campusBootPacks()]).then((got) => {
				engine.copyToFS('/campus.pck', pack);
				pack = null;
				for (const boot of got[2]) engine.copyToFS('/boot/' + boot.file, boot.bytes);
				const upd = got[1];
				if (upd) {
					engine.copyToFS('/ota_web/patch.pck', upd.bytes);
					engine.copyToFS('/ota_web/patch.json', new TextEncoder().encode(JSON.stringify(upd.info)));
				}
			}).then(() => engine.start({
				'args': ['--main-pack', '/campus.pck'],
				'onProgress': showProgress,
			}));
		}).then(() => {
			campusItemPacks();
			window.ccStarted = true; { const b = document.getElementById('cc-logbtn'); if (b) b.style.display = 'none'; }
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
